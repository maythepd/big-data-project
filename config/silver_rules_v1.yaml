# Silver cleaning parameters. values/units checks (reports/values_units_full_01) measured the impact of
# every entry; rule finalization fixed them with that evidence (SILVER_PLAN.md §7-8, EDA_FINDINGS.md).
# Read by: src/eda/check_values_units.py (impact), src/silver/* (build).
version: v1.2
status: final            # v1 finalized 25/10/2026; v1.1 (04/11/2026) adds the temperature c/f pair decisions;
                         # v1.2 (05/11/2026) adds unpaired temperature channels, gas twin channels, R14 v2

normalization:
  # Applied after trim + lower-case on units.
  units_aliases:
    "μg/m³": "µg/m³"     # U+03BC (Greek mu) -> U+00B5 (micro sign)
    "ugm3": "µg/m³"
    "mb": "hpa"
  # Applied after trim + lower-case on parameter.
  parameter_aliases:
    humidity: relativehumidity
    ozone: o3             # Values/units checks: values are ppm despite units "ppb" -> R06b relabel_ppm
    pm25-old: pm25        # 1,824 rows; values/units checks checks overlap with pm25 of the same sensor

# Canonical unit per parameter after conversion.
canonical_units:
  pm1: "µg/m³"
  pm25: "µg/m³"
  pm4: "µg/m³"
  pm10: "µg/m³"
  bc: "µg/m³"
  o3: ppm
  no2: ppm
  so2: ppm
  co: ppm
  "no": ppm
  nox: ppm
  co2: ppm
  ch4: ppm
  temperature: c
  relativehumidity: "%"
  pressure: hpa
  wind_speed: m/s
  wind_direction: deg
  voc: iaq
  um003: particles/cm³
  um005: particles/cm³
  um010: particles/cm³
  um025: particles/cm³
  um050: particles/cm³
  um100: particles/cm³
  ufp: particles/cm³

# Gas conversions at 25 °C and 1 atm: ppm = µg/m³ * molar_volume / (MW * 1000).
molar_volume_l: 24.45
molecular_weight:
  o3: 48.00
  no2: 46.01
  so2: 64.07
  co: 28.01
  "no": 30.01
# NOx has no single molecular weight: µg/m³ values are NOT converted (kept, flagged unit_unconverted).
no_mass_conversion: [nox]

# R04: measurements before this or after the build time are invalid.
time_range:
  min_utc: "2000-01-01T00:00:00Z"

# (parameter, units) pairs that cannot be valid measurements.
invalid_pairs:
  - [pm25, ppm]           # 414 rows

# Exact values treated as sentinels (value -> null, dq flag "sentinel").
# Values/units checks (flagged_top_values, full): -999 7.9M rows, 9999 3.9M, -9999 1.5M, -995 1.4M,
# -998 0.37M, -1000 0.71M (co µg/m³), -1111 0.23M, -999.9, -99.99, 99999.01: each in >= 3
# (parameter, units) groups. Values like 42949472 (pressure mb) and -132.6 (temperature)
# are already outside the hard bounds.
sentinels: [-9999, -1111, -1000, -999.9, -999, -998, -995, -99.99, 9999, 65535, 99999.01,
            4294967295, 42949672.95]
# |value| at or above this is treated as a sentinel/garbage value.
extreme_abs: 1.0e9

# Hard physical bounds in the canonical unit: outside -> invalid.
# negative_small_min: values in [negative_small_min, 0) are kept as "negative_small" (suspect).
bounds:
  pm1:              {min: -10,   max: 1500,  negative_small_min: -10}
  pm25:             {min: -10,   max: 1500,  negative_small_min: -10}
  pm4:              {min: -10,   max: 1500,  negative_small_min: -10}
  pm10:             {min: -10,   max: 5000,  negative_small_min: -10}
  bc:               {min: -20,   max: 200,   negative_small_min: -20}
  o3:               {min: -0.01, max: 2,     negative_small_min: -0.01}
  no2:              {min: -0.01, max: 2,     negative_small_min: -0.01}
  so2:              {min: -0.01, max: 2,     negative_small_min: -0.01}
  "no":               {min: -0.01, max: 5,     negative_small_min: -0.01}
  nox:              {min: -0.01, max: 5,     negative_small_min: -0.01}
  co:               {min: -0.5,  max: 100,   negative_small_min: -0.5}
  co2:              {min: 250,   max: 10000}
  ch4:              {min: 0,     max: 100}
  temperature:      {min: -90,   max: 60}
  relativehumidity: {min: 0,     max: 105}
  pressure:         {min: 300,   max: 1100}
  wind_speed:       {min: 0,     max: 75}
  wind_direction:   {min: 0,     max: 360}
  voc:              {min: 0,     max: 500}
  um003:            {min: 0,     max: 65534}
  um005:            {min: 0,     max: 65534}
  um010:            {min: 0,     max: 65534}
  um025:            {min: 0,     max: 65534}
  um050:            {min: 0,     max: 65534}
  um100:            {min: 0,     max: 65534}
  ufp:              {min: 0,     max: 1000000}

# Histogram resolution (decimals) per canonical unit, used for deterministic
# quantiles in Values/units checks: 0.1 µg/m³, 0.0001 ppm (0.1 ppb), 0.1 °C ...
histogram_decimals:
  default: 2
  "µg/m³": 1
  ppm: 4
  c: 1
  "%": 1
  hpa: 1
  m/s: 2
  deg: 0
  iaq: 0
  particles/cm³: 0

# Per-sensor unit sanity: sensor median vs global median of the same canonical group.
unit_check:
  ratio_suspect: 100      # >= 100x or <= 1/100 -> unit_suspect
  temperature_c_median_max: 45   # a "c" sensor with median above this is likely °F

# R06b per-sensor unit decisions (src/silver/build_sensor_units.py -> silver/dim_sensor_unit).
# Values/units checks (full): co/ppb 630 of 661 sensors and nox/ppb 570 of 859 sit ~1000x below the
# group after /1000 (values already ppm); 10,841 of 19,458 temperature/c sensors have a
# median > 45 (°F values).
unit_relabel:
  ppb_as_ppm_max_ratio: 0.01           # median/group <= this after /1000 -> relabel_ppm
  c_as_f_converted_median: [-40, 45]   # relabel_f only if the °F->°C median is plausible
  # v1.1: c and f temperature channels of one device with identical raw values (Silver EDA
  # sensor pairs). Both directions occur (reports/temperature_units_audit_01): the right
  # channel is the one closer to the neighbouring locations at the same hours
  # (src/silver/check_temperature_pairs.py -> reports/temperature_pairs_01).
  temperature_pair_tolerance_c: 1.0     # |f - (c - 32) * 5/9| below this -> same raw value
  temperature_pair_min_share: 0.9       # share of pair-hours that must match
  temperature_pair_neighbour_km: 100    # reference: nearest other locations within this radius
  temperature_pair_neighbours: 10       # ... at most this many
  temperature_pair_reference_min_rows: 3000   # reference sensors: long-running only
  # No reference in range: fallback on the c median, calibrated on the neighbour-checked pairs.
  temperature_pair_fallback_c_median_min: 35  # short-lived c with median >= -> c carries °F (141/141)
  temperature_pair_fallback_c_median_max: 25  # long-running c with median <= -> f carries °C (142/144)
  temperature_pair_margin_c: 3.0        # median error must be lower by this much, else unclear
  temperature_c_p99_max: 50             # other c sensors with p99 above -> suspect (no air reaches 50 °C)
  # v1.2: channels in no pair, checked against the same neighbour reference on a sample of their hours
  temperature_channel_sample_hours: 150
  temperature_channel_max_err_c: 5.0       # other_unit is relabelled only if the other unit is this close to the neighbours
  temperature_channel_far_c: 10.0          # as declared but median error above this under both units -> suspect
  temperature_channel_far_min_hours: 24    #   ... with at least this many reference hours
  temperature_channel_far_min_neighbours: 3  #   ... and this many neighbour locations
  # v1.2: the newer channel of a co-located gas pair whose values differ by an exact unit factor
  # (check_gas_sensor_agreement.py) copies the older channel's raw number under a wrong label
  gas_twin_factors: [ppb_ugm3, ppm_ppb, ppm_ugm3]

# Soft outliers (flag only, never drop). R14 v1 was never applied (Silver v1, v1.1): on the
# sample months flatline (>= 24 equal rows) hit 15.5% of temperature, 11% of RH and 9.1% of o3
# rows because 24 rows of a 1-minute sensor are 24 minutes. pm25 > pm10 in 0.59% of
# location-hours. The v1 keys below are only read by check_values_units.py.
soft_outliers:
  sample_months: ["2019-01", "2023-10", "2026-01"]   # values/units checks estimate rates on these
  flatline_min_run: 24
  spike_ratio: 10
  spike_min_value: {pm25: 100, pm10: 200}
  pm25_gt_pm10_tolerance: {ratio: 1.1, abs: 5}
  # R14 v2 (Silver v1.2): src/silver/flag_temporal_outliers.py on the built (deduped) Silver,
  # thresholds from reports/temporal_outliers_01 (EDA_FINDINGS.md, Silver v1.2 step 1).
  context_hours: 168          # rows of the previous / next month read around each month (= longest run threshold)
  flatline:
    parameters: [pm1, pm25, pm4, pm10, bc, o3, no2, so2, "no", nox, co, temperature, relativehumidity]
    min_hours: 24             # same value held this long (first to last reading of the run)
    min_readings: 6
    negative_min_hours: 6     # -1 µg/m³, -0.0005 ppm "no data" codes
    # Low-resolution gas instruments repeat their last digit in clean air: at or below the
    # floor (zero included) only a week-long run means a dead sensor.
    floor: {o3: 0.002, no2: 0.002, so2: 0.002, "no": 0.002, nox: 0.002, co: 0.3}
    floor_min_hours: 168
  spike:
    ratio: 10                 # value >= ratio x reference ...
    min_diff: {pm1: 500, pm25: 500, pm4: 500, pm10: 1000, o3: 0.5, no2: 0.5, so2: 0.5, "no": 0.5, co: 10,
               temperature: 15}   # ... and value - reference >= this (canonical unit)
    diff_only: [temperature]  # |value - reference| >= min_diff, no ratio
    min_hour_readings: 3      # reading vs its sensor-hour median only with this many readings in the hour
