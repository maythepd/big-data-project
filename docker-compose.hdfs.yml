# Simulated HDFS: 1 NameNode + 4 DataNodes, each block on 3 of them.
#   docker compose -f docker-compose.hdfs.yml up -d
#   docker compose -f docker-compose.hdfs.yml run --rm hdfs-client hdfs dfsadmin -report
name: openaq-hdfs

x-hadoop: &hadoop
  image: apache/hadoop:3.4.3
  # volumes are root-owned, so the daemons run as root
  user: root
  environment: &hadoop-env
    CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
    HDFS-SITE.XML_dfs.replication: "3"
    HDFS-SITE.XML_dfs.namenode.name.dir: /hadoop/dfs/name
    HDFS-SITE.XML_dfs.datanode.data.dir: /hadoop/dfs/data
    # container IPs have no reverse DNS entry for the NameNode to verify
    HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"
    # a stopped DataNode is declared dead after 1 min (default 10.5)
    HDFS-SITE.XML_dfs.namenode.heartbeat.recheck-interval: "15000"
    HADOOP_HEAPSIZE_MAX: ${OPENAQ_HDFS_HEAP:-512m}   # scripts/stack.sh lite lowers it

x-datanode: &datanode
  <<: *hadoop
  command: ["hdfs", "datanode"]
  depends_on:
    - namenode

services:
  namenode:
    <<: *hadoop
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"   # web UI: live DataNodes, block counts at http://localhost:9870
    environment:
      <<: *hadoop-env
      # the image formats the NameNode only when this directory is missing (first start)
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name/current
    volumes:
      - namenode:/hadoop/dfs/name

  datanode1:
    <<: *datanode
    container_name: datanode1
    hostname: datanode1
    volumes:
      - datanode1:/hadoop/dfs/data

  datanode2:
    <<: *datanode
    container_name: datanode2
    hostname: datanode2
    volumes:
      - datanode2:/hadoop/dfs/data

  datanode3:
    <<: *datanode
    container_name: datanode3
    hostname: datanode3
    volumes:
      - datanode3:/hadoop/dfs/data

  datanode4:
    <<: *datanode
    container_name: datanode4
    hostname: datanode4
    volumes:
      - datanode4:/hadoop/dfs/data

  # hdfs commands inside the cluster network (DataNodes are unreachable from outside)
  hdfs-client:
    <<: *hadoop
    profiles: ["client"]
    working_dir: /project
    volumes:
      - .:/project

# `docker compose -f docker-compose.hdfs.yml down -v` deletes these and the cluster's data
volumes:
  namenode:
  datanode1:
  datanode2:
  datanode3:
  datanode4:
