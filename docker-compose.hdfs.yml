# Multi-machine HDFS cluster for testing block replication: each container plays
# one machine (1 NameNode + 4 DataNodes) and every block is stored on 3 different
# DataNodes (dfs.replication=3). With 4 DataNodes, stopping one makes HDFS copy
# its blocks to the remaining nodes. To simulate more machines, copy a datanodeN
# service and its volume.
#
# Kept separate from docker-compose.yml (Kafka) so the batch and streaming stacks
# start and stop independently:
#   docker compose -f docker-compose.hdfs.yml up -d
#   docker compose -f docker-compose.hdfs.yml run --rm hdfs-client hdfs dfsadmin -report
name: openaq-hdfs

x-hadoop: &hadoop
  image: apache/hadoop:3.4.3
  # named volumes are created root-owned, so the daemons run as root (the HDFS superuser)
  user: root
  environment: &hadoop-env
    CORE-SITE.XML_fs.defaultFS: hdfs://namenode:8020
    HDFS-SITE.XML_dfs.replication: "3"
    HDFS-SITE.XML_dfs.namenode.name.dir: /hadoop/dfs/name
    HDFS-SITE.XML_dfs.datanode.data.dir: /hadoop/dfs/data
    # container IPs have no reverse DNS entry for the NameNode to verify
    HDFS-SITE.XML_dfs.namenode.datanode.registration.ip-hostname-check: "false"
    # a stopped DataNode is declared dead after 2 * 15 s + 10 * 3 s heartbeats = 1 min
    # (default 10.5 min), so re-replication starts while you watch
    HDFS-SITE.XML_dfs.namenode.heartbeat.recheck-interval: "15000"
    HADOOP_HEAPSIZE_MAX: 512m

x-datanode: &datanode
  <<: *hadoop
  command: ["hdfs", "datanode"]
  depends_on:
    - namenode

services:
  namenode:
    <<: *hadoop
    container_name: namenode
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"   # web UI: live DataNodes, block counts at http://localhost:9870
    environment:
      <<: *hadoop-env
      # the image formats the NameNode only when this directory is missing (first start)
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name/current
    volumes:
      - namenode:/hadoop/dfs/name

  datanode1:
    <<: *datanode
    container_name: datanode1
    hostname: datanode1
    volumes:
      - datanode1:/hadoop/dfs/data

  datanode2:
    <<: *datanode
    container_name: datanode2
    hostname: datanode2
    volumes:
      - datanode2:/hadoop/dfs/data

  datanode3:
    <<: *datanode
    container_name: datanode3
    hostname: datanode3
    volumes:
      - datanode3:/hadoop/dfs/data

  datanode4:
    <<: *datanode
    container_name: datanode4
    hostname: datanode4
    volumes:
      - datanode4:/hadoop/dfs/data

  # Runs hdfs commands and project scripts inside the cluster network: a client
  # outside Docker can reach the NameNode port but not the DataNodes, which serve
  # block data from container IPs. `run` starts it on demand; `up` skips it.
  hdfs-client:
    <<: *hadoop
    profiles: ["client"]
    working_dir: /project
    volumes:
      - .:/project

# `docker compose -f docker-compose.hdfs.yml down -v` deletes these and the cluster's data
volumes:
  namenode:
  datanode1:
  datanode2:
  datanode3:
  datanode4:
