# Spark in containers; start Kafka, HDFS and MongoDB first (or scripts/stack.sh).
#   docker compose -f docker-compose.spark.yml up -d --build      # streaming consumer
#   docker compose -f docker-compose.spark.yml run --rm spark-job /opt/spark/bin/spark-submit <script>
name: openaq-spark

x-spark: &spark
  build: docker/spark
  image: openaq-spark
  working_dir: /app
  environment: &spark-env
    PYTHONPATH: /app            # lets the scripts import src.common
    HADOOP_USER_NAME: root      # the HDFS superuser in docker-compose.hdfs.yml
  volumes:
    - .:/app

services:
  spark-consumer:
    <<: *spark
    container_name: spark-consumer
    restart: unless-stopped
    ports:
      - "4040:4040"   # Spark UI with a Structured Streaming tab at http://localhost:4040
    environment:
      <<: *spark-env
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      MONGO_HOST: mongo           # MONGO_PASSWORD is read from the mounted .env
      HDFS_URI: ${HDFS_URI:-hdfs://namenode:8020}
      # one root per rules version (v1_2); a rules change needs a new root and checkpoint
      STREAM_SILVER_ROOT: ${STREAM_SILVER_ROOT:-hdfs://namenode:8020/openaq/silver/stream/v1_2}
      STREAM_SILVER_CHECKPOINT: ${STREAM_SILVER_CHECKPOINT:-hdfs://namenode:8020/openaq/checkpoints/silver_stream_v1_2}
      # Kafka start for a new checkpoint: earliest | latest | JSON (src.streaming.checkpoint_offsets)
      STREAM_STARTING_OFFSETS: ${STREAM_STARTING_OFFSETS:-earliest}
      STREAM_STARTING_OFFSETS_ARCHIVE: ${STREAM_STARTING_OFFSETS_ARCHIVE:-}
      STREAM_STARTING_OFFSETS_LATEST: ${STREAM_STARTING_OFFSETS_LATEST:-}
      STREAM_STARTING_OFFSETS_SILVER: ${STREAM_STARTING_OFFSETS_SILVER:-}
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
      - --conf
      - spark.jars.ivy=/tmp/.ivy2   # the image's spark user has no home for the default ~/.ivy2
      - src/streaming/consumer.py
    networks:
      - kafka
      - hdfs
      - serving

  # one-off batch jobs (`run` only)
  spark-job:
    <<: *spark
    profiles: ["job"]
    networks:
      - hdfs

networks:
  kafka:
    external: true
    name: openaq-kafka
  hdfs:
    external: true
    name: openaq-hdfs_default
  serving:
    external: true
    name: openaq-serving
