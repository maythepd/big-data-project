# Spark in containers; start Kafka, HDFS and MongoDB first (or scripts/stack.sh).
#   docker compose -f docker-compose.spark.yml up -d --build      # streaming consumer
#   docker compose -f docker-compose.spark.yml run --rm spark-job /opt/spark/bin/spark-submit <script>
name: openaq-spark

x-spark: &spark
  build: docker/spark
  image: openaq-spark
  working_dir: /app
  environment: &spark-env
    # src.* for the scripts; pyspark/py4j so plain `python3` (pytest) works without spark-submit
    PYTHONPATH: /app:/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
    HADOOP_USER_NAME: root      # the HDFS superuser in docker-compose.hdfs.yml
  volumes:
    - .:/app
    - ivy:/tmp/.ivy2   # --packages jars (Kafka, Delta) downloaded once, not per container

services:
  spark-consumer:
    <<: *spark
    container_name: spark-consumer
    restart: unless-stopped
    ports:
      - "4040:4040"   # Spark UI with a Structured Streaming tab at http://localhost:4040
    environment:
      <<: *spark-env
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      MONGO_HOST: mongo           # MONGO_PASSWORD is read from the mounted .env
      HDFS_URI: ${HDFS_URI:-hdfs://namenode:8020}
      # one root per rules version (v1_2); a rules change needs a new root and checkpoint
      STREAM_SILVER_ROOT: hdfs://namenode:8020/openaq/silver/stream/v1_2
      STREAM_SILVER_CHECKPOINT: hdfs://namenode:8020/openaq/checkpoints/silver_stream_v1_2
      # Kafka start for a new checkpoint: earliest | latest | JSON (src.streaming.checkpoint_offsets)
      STREAM_STARTING_OFFSETS: ${STREAM_STARTING_OFFSETS:-earliest}
      STREAM_STARTING_OFFSETS_ARCHIVE: ${STREAM_STARTING_OFFSETS_ARCHIVE:-}
      STREAM_STARTING_OFFSETS_LATEST: ${STREAM_STARTING_OFFSETS_LATEST:-}
      STREAM_STARTING_OFFSETS_SILVER: ${STREAM_STARTING_OFFSETS_SILVER:-}
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
      - --conf
      - spark.jars.ivy=/tmp/.ivy2   # the image's spark user has no home for the default ~/.ivy2
      - src/streaming/consumer.py
    networks:
      - kafka
      - hdfs
      - serving

  # one-off batch jobs (`run` only)
  spark-job:
    <<: *spark
    profiles: ["job"]
    networks:
      - hdfs

  # one-off jobs on the local lake (./openaq_lake, /app/openaq_lake inside); needs no other stack
  spark-lake:
    <<: *spark
    profiles: ["job"]

  # the consumer under test in the big-data experiments (docs/bigdata-experiments.md): the same
  # code on the replay topic, writing to hdfs:///replay/<run>; scripts/experiments/*.sh set REPLAY_*
  spark-replay:
    <<: *spark
    profiles: ["replay"]
    container_name: spark-replay
    ports:
      - "4041:4040"   # Spark UI of the run
    environment:
      <<: *spark-env
      KAFKA_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      HDFS_URI: hdfs://namenode:8020
      STREAM_TOPIC: ${REPLAY_TOPIC:-air-quality-replay}
      STREAM_HDFS_ROOT: hdfs://namenode:8020/replay/${REPLAY_RUN:-replay}
      STREAM_QUERIES: ${REPLAY_QUERIES:-archive,silver,deadletter}
      STREAM_MAX_OFFSETS_PER_TRIGGER: ${REPLAY_MAX_OFFSETS:-}
      STREAM_SHUFFLE_PARTITIONS: ${REPLAY_SHUFFLE_PARTITIONS:-4}
      STREAM_ARCHIVE_TRIGGER: ${REPLAY_TRIGGER:-30 seconds}
      STREAM_SILVER_TRIGGER: ${REPLAY_TRIGGER:-30 seconds}
      STREAM_STARTING_OFFSETS: earliest
      STREAM_RESTART_DELAY_S: "10"
      STREAM_PROGRESS_LOG: /app/openaq_lake/replay/${REPLAY_RUN:-replay}/progress.jsonl
      STREAM_DIM_LOCATION: file:///app/openaq_lake/silver/dim_location
      STREAM_SENSOR_UNITS: file:///app/openaq_lake/silver/dim_sensor_unit
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - local[*]
      - --driver-memory
      - ${REPLAY_DRIVER_MEMORY:-3g}
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.9
      - --conf
      - spark.jars.ivy=/tmp/.ivy2
      - src/streaming/consumer.py
    networks:
      - kafka
      - hdfs

volumes:
  ivy:

networks:
  kafka:
    external: true
    name: openaq-kafka
  hdfs:
    external: true
    name: openaq-hdfs_default
  serving:
    external: true
    name: openaq-serving
