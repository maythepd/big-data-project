# Kafka: 3 brokers (KRaft), every partition on all 3, writes need 2 copies,
# so the cluster keeps working with one broker down.
x-kafka: &kafka
  image: apache/kafka:3.9.0
  environment: &kafka-env
    # every node is also a controller: losing one keeps a majority
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    # all nodes format their storage with the same cluster id on first start
    CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    # PLAINTEXT      -> other containers (Spark, kafka-ui) connect via kafka1:29092,kafka2:29092,kafka3:29092
    # PLAINTEXT_HOST -> your laptop connects via localhost:9092,localhost:9094,localhost:9096
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    # replication: 3 copies of every topic, writes with acks=all need 2 of them
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    # named volumes: only `down -v` deletes them
    KAFKA_LOG_DIRS: /var/lib/kafka/data
    # scripts/stack.sh lite lowers the heap
    KAFKA_HEAP_OPTS: ${OPENAQ_KAFKA_HEAP:--Xmx512m -Xms512m}

services:
  kafka1:
    <<: *kafka
    container_name: kafka1
    hostname: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:9092
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka
    container_name: kafka2
    hostname: kafka2
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka2:29092,PLAINTEXT_HOST://localhost:9094
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka
    container_name: kafka3
    hostname: kafka3
    ports:
      - "9096:9096"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9096,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka3:29092,PLAINTEXT_HOST://localhost:9096
    volumes:
      - kafka3-data:/var/lib/kafka/data

  # one-shot: creates the topic once all 3 brokers are up
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: kafka-init
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:29092,kafka2:29092,kafka3:29092 \
          --create --if-not-exists --topic air-quality --partitions 3 --replication-factor 3 \
          --config min.insync.replicas=2; do sleep 2; done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:29092 --describe --topic air-quality
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    ports:
      - "8080:8080"   # browse topics/messages at http://localhost:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092

  # message contracts (config/schemas, src/common/contract.py); stores schemas in the _schemas topic.
  # Only for the schema experiment: docker compose --profile registry up -d schema-registry
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    container_name: schema-registry
    profiles: ["registry"]
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: -Xmx256m -Xms256m

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:

networks:
  default:
    name: openaq-kafka   # fixed name so docker-compose.spark.yml can join it
