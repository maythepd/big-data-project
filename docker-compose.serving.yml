# MongoDB serving layer: latest_readings (consumer) and Gold collections (load_mongo.py).
# localhost:27017, user airquality (authSource admin), password MONGO_PASSWORD from .env.
name: openaq-serving

services:
  mongo:
    image: mongo:8.0.4
    container_name: mongo
    # capped cache and memory on a shared 7.6 GB machine; lower in stack.sh lite
    command: ["--wiredTigerCacheSizeGB", "${OPENAQ_MONGO_CACHE_GB:-1.5}"]
    mem_limit: ${OPENAQ_MONGO_MEM:-2.5g}
    environment:
      MONGO_INITDB_ROOT_USERNAME: airquality
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    ports:
      - "127.0.0.1:27017:27017"   # reachable from this laptop only
    volumes:
      # `docker compose -f docker-compose.serving.yml down -v` deletes the data
      - mongo-data:/data/db

volumes:
  mongo-data:

networks:
  default:
    name: openaq-serving   # fixed name so docker-compose.spark.yml can join it
